name: Build deploy package

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: sheytoni-deploy
          path: sheytoni-deploy.zip
          retention-days: 90
